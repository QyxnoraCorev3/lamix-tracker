<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamix SID Tracker & Analyzer</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f0f2f5; margin: 0; padding: 15px; }
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h3 { margin-top: 0; color: #1a73e8; font-size: 18px; }
        textarea, input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:active { background: #0b57d0; }
        .result-box { padding: 12px; border-radius: 6px; margin-top: 10px; }
        .matched { background: #e6f4ea; border: 1px solid #34a853; color: #137333; }
        .not-matched { background: #feefee; border: 1px solid #ea4335; color: #c5221f; }
        .badge { display: inline-block; padding: 3px 8px; background: #e8f0fe; color: #1a73e8; border-radius: 4px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h3>১. লামিক্স পোস্ট আপলোড</h3>
        <textarea id="rawInput" rows="5" placeholder="লামিক্স চ্যানেল থেকে কপি করা নোটিশ এখানে পেস্ট করুন..."></textarea>
        <button onclick="saveData()">ডাটা সেভ করুন</button>
        <p id="saveMsg" style="font-size: 12px; color: green;"></p>
    </div>

    <div class="card">
        <h3>২. নাম / SID সার্চ ও এনালাইসিস</h3>
        <input type="text" id="searchInput" placeholder="যেমন: AUTH, SEAML, 4478730...">
        <button onclick="searchAndAnalyze()">সার্চ করুন</button>
        
        <div id="resultArea" style="display: none;"></div>
    </div>

    <script>
        // গ্লোবাল এনালাইসিস রুলস (Betting, Crypto, Dating, Payment ইত্যাদি সনাক্ত করার জন্য)
        const categories = {
            "Crypto / Exchange": ["BITGET", "KUCOIN", "BINANCE", "OKX", "BYBIT"],
            "Banking & Payment": ["STRIPE", "VISA", "ALIPAY", "RZRPAY", "PLUXEE", "NETELLER"],
            "Betting & Gambling": ["GOLDEN NUGGET", "BETWAY", "1XBET", "BETM", "CASINO"],
            "Dating & Social": ["TIKTOK", "LINKEDIN", "TINDER", "BUMBLE"],
            "AI & Tech Services": ["CHATGPT", "OPENAI", "OKTA", "GITLAB", "MICROSOFT", "MANUS"],
            "E-Commerce & Transport": ["AIRBNB", "BOOKING", "SHOPEE", "TEMU", "UBER", "GRAB", "GOJEK", "BOLT"]
        };

        // ডাটা সেভ করার ফাংশন (Local Storage)
        function saveData() {
            let text = document.getElementById('rawInput').value.trim();
            if (!text) return alert("মেসেজ পেস্ট করুন!");

            let db = JSON.parse(localStorage.getItem('lamix_db') || "[]");
            let lines = text.split("\n");
            let addedCount = 0;

            lines.forEach(line => {
                if (line.includes(":") && (line.includes("code") || line.includes("Your") || line.includes("http"))) {
                    let parts = line.split(":", 2);
                    let sid = parts[0].trim();
                    let content = parts[1].trim();

                    db.push({ sid: sid, content: content, date: new Date().toLocaleDateString() });
                    addedCount++;
                }
            });

            localStorage.setItem('lamix_db', JSON.stringify(db));
            document.getElementById('saveMsg').innerText = `✔ ${addedCount} টি রেকর্ড সেভ হয়েছে! (মোট ডাটা: ${db.length})`;
            document.getElementById('rawInput').value = "";
        }

        // ক্যাটাগরি প্রেডিকশন
        function predictCategory(text) {
            let txtUpper = text.toUpperCase();
            for (let cat in categories) {
                for (let keyword of categories[cat]) {
                    if (txtUpper.includes(keyword)) return cat;
                }
            }
            return "General OTP / Service";
        }

        // সার্চ এবং এনালাইসিস ফাংশন
        function searchAndAnalyze() {
            let query = document.getElementById('searchInput').value.trim().toUpperCase();
            let resultDiv = document.getElementById('resultArea');
            if (!query) return alert("সার্চ করার জন্য কিছু লিখুন!");

            let db = JSON.parse(localStorage.getItem('lamix_db') || "[]");
            let cleanQuery = query.replace(/X/g, ""); // 'XXXX' বাদ দেওয়া

            // ১. সেভ করা ডাটায় চেক
            let matches = db.filter(item => 
                item.sid.toUpperCase().includes(cleanQuery) || 
                item.content.toUpperCase().includes(cleanQuery)
            );

            resultDiv.style.display = "block";

            if (matches.length > 0) {
                let html = `<div class="result-box matched">
                    <h4>[✔] আপনার সেভ করা ডাটার সাথে মিলে গেছে!</h4>`;
                matches.forEach(m => {
                    let cat = predictCategory(m.content + " " + m.sid);
                    let type = m.content.toLowerCase().includes("http") ? "Website Link" : "App OTP";
                    html += `<p><b>SID:</b> ${m.sid}<br>
                    <b>মেসেজ:</b> ${m.content}<br>
                    <b>টাইপ:</b> <span class="badge">${type}</span> | <b>ক্যাটাগরি:</b> <span class="badge">${cat}</span></p><hr>`;
                });
                html += `</div>`;
                resultDiv.innerHTML = html;
            } else {
                // ২. যদি ডাটায় না থাকে তাহলে এনালাইসিস
                let predictedCat = predictCategory(query);
                resultDiv.innerHTML = `<div class="result-box not-matched">
                    <h4>[✖] আপনার সেভ করা ডাটায় পাওয়া যায়নি।</h4>
                    <p><b>বিশ্লেষণ (Analysis):</b></p>
                    <p>সার্চ ইনপুট: <b>${query}</b></p>
                    <p>সম্ভাব্য সার্ভিস ক্যাটাগরি: <span class="badge">${predictedCat}</span></p>
                    <p><i>নোট: এটি লামিক্সে সচল কোনো ${predictedCat} ভিত্তিক অ্যাপ বা ওয়েবসাইটের কাজের নাম হতে পারে।</i></p>
                </div>`;
            }
        }
    </script>
</body>
</html>
